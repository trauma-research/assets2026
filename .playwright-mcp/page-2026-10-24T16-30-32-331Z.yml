                - generic [ref=f3e433]: "01"
              - heading "Primary researcher" [level=3] [ref=f3e434]
              - paragraph [ref=f3e435]: Holds the relationship with participants and makes the decisions in the room.
              - list [ref=f3e436]:
                - listitem [ref=f3e437]: — Controls what is asked, when, and whether to stop.
                - listitem [ref=f3e438]: — Sees the room, the pauses, and everything the recorder misses.
                - listitem [ref=f3e439]: — Cannot see what the institution will defend, or what happens once the study closes.
            - article [ref=f3e440]:
              - generic [ref=f3e441]:
                - generic [ref=f3e442]: Persona
                - generic [ref=f3e443]: "02"
              - heading "Research supervisor" [level=3] [ref=f3e444]
              - paragraph [ref=f3e445]: Accountable for the study and for the people running it.
              - list [ref=f3e446]:
                - listitem [ref=f3e447]: — Controls workload, what counts as enough data, and whose career is exposed.
                - listitem [ref=f3e448]: — Sees the pattern across projects and students.
                - listitem [ref=f3e449]: — Cannot see what actually happened in the interview room.
            - article [ref=f3e450]:
              - generic [ref=f3e451]:
                - generic [ref=f3e452]: Persona
                - generic [ref=f3e453]: "03"
              - heading "Ethics and data protection" [level=3] [ref=f3e454]
              - paragraph [ref=f3e455]: Approves the protocol and sets the conditions it runs under.
              - list [ref=f3e456]:
                - listitem [ref=f3e457]: — Controls approval, conditions, and what may be stored and for how long.
                - listitem [ref=f3e458]: — Sees the written protocol.
                - listitem [ref=f3e459]: — Cannot see the gap between the protocol and the practice.
            - article [ref=f3e460]:
              - generic [ref=f3e461]:
                - generic [ref=f3e462]: Persona
                - generic [ref=f3e463]: "04"
              - heading "Safeguarding lead" [level=3] [ref=f3e464]
              - paragraph [ref=f3e465]: Acts when a threshold is met, whatever the research needs.
              - list [ref=f3e466]:
                - listitem [ref=f3e467]: — Controls escalation, and where the threshold sits.
                - listitem [ref=f3e468]: — Sees the risk, once somebody reports it.
                - listitem [ref=f3e469]: — Cannot see what the participant wanted to happen.
            - article [ref=f3e470]:
              - generic [ref=f3e471]:
                - generic [ref=f3e472]: Persona
                - generic [ref=f3e473]: "05"
              - heading "Research participant" [level=3] [ref=f3e474]
              - paragraph [ref=f3e475]: Gives the account, and lives with having given it.
              - list [ref=f3e476]:
                - listitem [ref=f3e477]: — Controls what to say, what to withhold, and whether to come back.
                - listitem [ref=f3e478]: — Sees exactly how they were treated.
                - listitem [ref=f3e479]: — Cannot see what happens to their words after they leave the room.
            - article [ref=f3e480]:
              - generic [ref=f3e481]:
                - generic [ref=f3e482]: Persona
                - generic [ref=f3e483]: "06"
              - heading "Parent or carer" [level=3] [ref=f3e484]
