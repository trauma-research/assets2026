        - heading "Make It Worse" [level=2] [ref=f3e12]
        - paragraph [ref=f3e13]:
          - text: A card game for two to six people, about the ways research goes wrong. The Dealer turns over a scenario; everyone plays a complication to make it worse. Reveal together, agree which does the most damage, then say what would have stopped it — and which principle that answer serves. Roughly five minutes a round. After every third round the table reads a
          - strong [ref=f3e14]: testimony card
          - text: instead — one person's own account, in their own words. Nobody plays a complication on those.
        - paragraph [ref=f3e16]:
          - strong [ref=f3e17]: Nobody is asked to talk about themselves.
          - text: You play a card, not an experience. Every harm on the table came out of the deck, so nothing in this game requires you to have been there. Anyone can pass at any point, for any reason or none.
        - generic [ref=f3e18]:
          - heading "Who is playing?" [level=3] [ref=f3e19]
          - generic [ref=f3e20]:
